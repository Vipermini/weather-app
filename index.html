<!DOCTYPE html>
<html>
<head>
   <meta name="viewpoint" content="width=device-width, initial scale=1.0">
   <title>weather app</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
   
<div class="card">
  <div class="search">
     <input type="text" placeholder="enter city name" spellcheck="false">
     <button> <img src="picture/search.png" ></button>
  </div>
  <div class="weather">
     <img src="picture/rain.png" class="weather-icon">
     <h3 class ="condition">rainy</h3>
     <h1 class="temp">22°C</h1>
     <h2 class="city">DHAKA</h2>
     <div class="details">
      <div class="col">
         <img src="picture/humidity.png">
         <div>
            <p class="humidity">50%</p>
            <p>humidity</p>
          </div>
      </div>
      <div class="col">
         <img src="picture/wind.png">
         <div>
            <p class="wind">15km/h</p>
            <p>Wind Speed</p>
         </div>
      </div>
     </div>
  </div>

</div>

<script>

const apiKey = "19524d7b115ce766e8b603b4cd774d2e";
const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

const searchBox = document.querySelector(".search input");
const searchBtn = document.querySelector(".search button");
const weatherIcon = document.querySelector(".weather-icon");
const condition = document.querySelector(".condition");

async function checkWeather(city) {
   const response = await fetch(apiUrl + city + `&appid=${apiKey}`);
   if (response.status == 404) {
        alert("City not found");
        return;
    }
   var data = await response.json();

   
   document.querySelector(".city").innerHTML = data.name;
   document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°C";
   document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
   document.querySelector(".wind").innerHTML = data.wind.speed + " km/h";
   
   
   if(data.weather[0].main=="Clouds"){
        weatherIcon.src = "picture/clouds.png";
        condition.innerHTML= "Cloudy 😞";
       

   }
   else if(data.weather[0].main=="Clear"){
        weatherIcon.src = "picture/clear.png";
        condition.innerHTML= "WO ho.. clear sky 😃😃";
        
   }
   else if(data.weather[0].main=="Rain"){
        weatherIcon.src = "picture/rain.png";
        condition.innerHTML= "Rainy 😢";
        
   }
   else if(data.weather[0].main=="Drizzle"){
        weatherIcon.src = "picture/drizzie.png";
        condition.innerHTML="Drizzle ";
        
   }
   else if(data.weather[0].main=="Mist"){
        weatherIcon.src = "picture/mist.png";
        condition.innerHTML= "Mist";
        
   }

   searchBox.value = "";
   document.querySelector(".weather").style.display = "block";
}


searchBtn.addEventListener("click", ()=>{
   checkWeather(searchBox.value);
})

searchBox.addEventListener("keydown",(e)=>{
    if(e.key === "Enter"){
     checkWeather(searchBox.value);
    }


});


</script>










</body>

</html>
